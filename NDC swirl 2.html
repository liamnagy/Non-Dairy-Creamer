<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypnotic Green & Purple Vortex</title>
    <style>
        /* Force absolute full-screen boundaries with no scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05000a; /* Deep cosmic dark purple background */
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Full screen orange flash layer controlled by JS opacity */
        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ff5500; /* Pure intense orange */
            opacity: 0;
            z-index: 2;
            pointer-events: none; /* Ignore pointer events to not disrupt the app */
            transition: opacity 0.05s ease-out; /* Snap fast onto the screen */
        }
        /* Tiny, minimalist full screen toggle anchored at the bottom */
        #fsBtn {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
            padding: 4px 10px;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 3px;
            cursor: pointer;
            transition: opacity 0.3s ease, background 0.2s ease, color 0.2s ease;
            opacity: 1;
        }
        #fsBtn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
    </style>
</head>
<body>
    <canvas id="vortexCanvas"></canvas>
    <div id="flash-overlay"></div>
    <button id="fsBtn">Full Screen</button>

    <script>
        const canvas = document.getElementById('vortexCanvas');
        const ctx = canvas.getContext('2d');
        const flashOverlay = document.getElementById('flash-overlay');
        const fsBtn = document.getElementById('fsBtn');

        // Dynamically scale canvas size to match current browser bounds
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        const particleCount = 1800; // Total density of the vortex
        
        // Colors configured into rgba structures to accommodate trailing fades
        const colors = [
            'rgba(0, 255, 136, ',   // Neon Mint Green
            'rgba(0, 200, 80, ',    // Emerald Green
            'rgba(150, 0, 255, ',   // Electric Violet
            'rgba(210, 50, 255, ',  // Bright Purple
            'rgba(90, 0, 140, '     // Deep Void Indigo
        ];

        // Seed initial array particles with variable paths, sizes, and tracking speeds
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                angle: Math.random() * Math.PI * 2,
                radius: Math.random() * Math.max(canvas.width, canvas.height) * 0.9,
                rotationSpeed: 0.008 + Math.random() * 0.015,
                funnelSpeed: 0.6 + Math.random() * 1.8,
                size: 0.8 + Math.random() * 2.5,
                color: colors[Math.floor(Math.random() * colors.length)],
                isOrange: false
            });
        }

        // Inject exactly one dedicated bright orange particle into the array loop
        particles.push({
            angle: Math.random() * Math.PI * 2,
            radius: Math.random() * Math.max(canvas.width, canvas.height) * 0.9,
            rotationSpeed: 0.012, // Stable, smooth rotation speed
            funnelSpeed: 1.0,     // Steady advance toward the center
            size: 3.5,            // Slightly larger scale to make it visibly distinct
            color: 'rgba(255, 85, 0, ', // Match the intense orange flash color
            isOrange: true
        });

        let isFlashing = false;
        let flashOpacity = 0;

        function animate() {
            // Apply semi-transparent black overlay to leave motion trails
            ctx.fillStyle = 'rgba(5, 0, 10, 0.07)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Render and process the particle stream
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                
                // Advance the spiral trajectory
                p.angle += p.rotationSpeed;
                p.radius -= p.funnelSpeed;

                // Respawn particle out to edges once it vanishes down the gravity well
                if (p.radius <= 4) {
                    p.radius = Math.max(canvas.width, canvas.height) * 0.85;
                    // Give the orange particle a fresh randomized approach angle upon reset
                    p.angle = Math.random() * Math.PI * 2;
                }

                // Mathematical translation to cartesian coordinates mapping a spiral
                const x = centerX + Math.cos(p.angle) * p.radius;
                const y = centerY + Math.sin(p.angle) * p.radius;

                // Dynamically drop visual alpha near the inner event horizon for depth
                let alpha = 1;
                if (p.radius < 120) {
                    alpha = p.radius / 120;
                }

                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color + alpha + ')';
                ctx.fill();
            }

            // Real-time flash updates
            if (!isFlashing) {
                // Low mathematical probability (~0.2%) evaluated per frame (~once every 5-8 seconds)
                if (Math.random() < 0.0025) {
                    isFlashing = true;
                    flashOpacity = 1.0;
                }
            } else {
                // Linear decay multiplier for the flash intensity
                flashOpacity -= 0.035; 
                if (flashOpacity <= 0) {
                    flashOpacity = 0;
                    isFlashing = false;
                }
            }
            flashOverlay.style.opacity = flashOpacity;

            requestAnimationFrame(animate);
        }

        // --- Inactivity & Full Screen UI Logic ---
        let hideTimeout;

        function showButton() {
            fsBtn.style.opacity = '1';
            fsBtn.style.pointerEvents = 'auto';
            clearTimeout(hideTimeout);
            // Hide the button after exactly 1 second (1000ms) of inactivity
            hideTimeout = setTimeout(() => {
                fsBtn.style.opacity = '0';
                fsBtn.style.pointerEvents = 'none';
            }, 1000);
        }

        // Reveal the button upon mouse movement, touch interaction, or keypresses
        window.addEventListener('mousemove', showButton);
        window.addEventListener('touchstart', showButton);
        window.addEventListener('keydown', showButton);

        // Native Full Screen Request Handler
        fsBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Avoid triggering immediate window interactions
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // Initialize the tracking loop
        showButton();
        animate();
    </script>
</body>
</html>
