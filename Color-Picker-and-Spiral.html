<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker and Spiral</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.1s ease;
            cursor: none; /* Hide the mouse cursor across the entire document */
        }

        /* Spiral canvas styling */
        #spiral-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 1;
        }

        #spiral-canvas.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <canvas id="spiral-canvas"></canvas>

    <script>
        const body = document.body;
        const spiralCanvas = document.getElementById('spiral-canvas');
        const ctx = spiralCanvas.getContext('2d');

        // Key mapping configuration (Numbers only)
        const colorMap = {
            '1': '#ffffff', // White
            '2': '#ff0000', // Red
            '3': '#ffa500', // Orange
            '4': '#ffff00', // Yellow
            '5': '#008000', // Green
            '6': '#0000ff', // Blue
            '7': '#800080', // Purple
            '8': '#000000'  // Black
        };

        // Custom transition configurations for action letter keys
        const specialTransitions = {
            'q': { color: colorMap['1'], baseDuration: 3.0 },
            'a': { color: colorMap['1'], baseDuration: 6.0 },
            'z': { color: colorMap['1'], baseDuration: 12.0 },
            'w': { color: colorMap['2'], baseDuration: 3.0 },
            's': { color: colorMap['2'], baseDuration: 6.0 },
            'x': { color: colorMap['2'], baseDuration: 12.0 },
            'e': { color: colorMap['3'], baseDuration: 3.0 },
            'd': { color: colorMap['3'], baseDuration: 6.0 },
            'c': { color: colorMap['3'], baseDuration: 12.0 },
            'r': { color: colorMap['4'], baseDuration: 3.0 },
            'f': { color: colorMap['4'], baseDuration: 6.0 },
            'v': { color: colorMap['4'], baseDuration: 12.0 },
            't': { color: colorMap['5'], baseDuration: 3.0 },
            'g': { color: colorMap['5'], baseDuration: 6.0 },
            'b': { color: colorMap['5'], baseDuration: 12.0 },
            'y': { color: colorMap['6'], baseDuration: 3.0 },
            'h': { color: colorMap['6'], baseDuration: 6.0 },
            'n': { color: colorMap['6'], baseDuration: 12.0 },
            'u': { color: colorMap['7'], baseDuration: 3.0 },
            'j': { color: colorMap['7'], baseDuration: 6.0 },
            'm': { color: colorMap['7'], baseDuration: 12.0 },
            'i': { color: colorMap['8'], baseDuration: 3.0 },
            'k': { color: colorMap['8'], baseDuration: 6.0 },
            ',': { color: colorMap['8'], baseDuration: 12.0 }
        };

        // State trackers for key press durations
        let activeKey = null;
        let keyPressTimer = null;
        let isTransitioning = false;

        // Spiral animation state variables
        let spiralActive = false;
        let spiralMode = 'bw'; // 'bw' (9), 'rainbow' (0), 'blood' (p), 'toxic' (;)
        let currentRotation = 0;
        let baseSpeed = 1.5; // Target speed in radians per second
        let targetSpeed = baseSpeed;
        let currentSpeed = baseSpeed;
        let speedTransitionStart = null;
        let startSpeed = baseSpeed;
        let endSpeed = baseSpeed;
        let lastFrameTime = performance.now();
        let hueOffset = 0;
        const TRANSITION_DURATION = 3000; // 3-second transition duration in ms

        // Spiral arm geometry parameters
        let armWidth = 0.5; // Angular width/thickness of each arm in radians
        const ARM_WIDTH_STEP = 0.05;
        const MIN_ARM_WIDTH = 0.05;
        const MAX_ARM_WIDTH = 1.5;

        // Distance parameter between spiral loops ('b')
        let loopDistance = 12;
        const LOOP_DIST_STEP = 1;
        const MIN_LOOP_DIST = 2;
        const MAX_LOOP_DIST = 50;

        function resizeCanvas() {
            spiralCanvas.width = window.innerWidth;
            spiralCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawSpiral(timestamp) {
            const dt = (timestamp - lastFrameTime) / 1000;
            lastFrameTime = timestamp;

            // Update hue for rainbow animation mode
            hueOffset = (hueOffset + dt * 60) % 360;

            // Handle speed reversal transition over 3 seconds
            if (speedTransitionStart !== null) {
                const elapsed = timestamp - speedTransitionStart;
                const progress = Math.min(elapsed / TRANSITION_DURATION, 1.0);
                
                // Smooth easing for direction transition
                const easedProgress = progress < 0.5 
                    ? 2 * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                currentSpeed = startSpeed + (endSpeed - startSpeed) * easedProgress;

                if (progress >= 1.0) {
                    speedTransitionStart = null;
                    currentSpeed = endSpeed;
                }
            }

            // Update rotation angle based on current speed
            currentRotation += currentSpeed * dt;

            // Clear screen
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, spiralCanvas.width, spiralCanvas.height);

            const centerX = spiralCanvas.width / 2;
            const centerY = spiralCanvas.height / 2;
            const maxRadius = Math.hypot(centerX, centerY);

            ctx.save();

            // Strict clip mask restricting all drawing within viewport boundaries
            ctx.beginPath();
            ctx.rect(0, 0, spiralCanvas.width, spiralCanvas.height);
            ctx.clip();

            ctx.translate(centerX, centerY);

            // Zoom in on the center 30% of the spiral by scaling up by (1 / 0.30)
            const zoomFactor = 1 / 0.30;
            ctx.scale(zoomFactor, zoomFactor);

            ctx.rotate(currentRotation);

            const b = loopDistance; // Distance parameter between spiral loops
            const numArms = 2; // Dual-arm symmetric spiral
            const step = 0.02;

            // Buffer theta so geometry extends far past screen edges even when zoomed
            const maxTheta = (maxRadius / b) + 1.0;

            if (spiralMode === 'rainbow') {
                // Render Neon Rainbow gradient-filled spiral arms
                const gradient = ctx.createConicGradient(0, 0, 0);
                gradient.addColorStop(0.0, `hsl(${hueOffset}, 100%, 55%)`);
                gradient.addColorStop(0.25, `hsl(${(hueOffset + 90) % 360}, 100%, 55%)`);
                gradient.addColorStop(0.50, `hsl(${(hueOffset + 180) % 360}, 100%, 55%)`);
                gradient.addColorStop(0.75, `hsl(${(hueOffset + 270) % 360}, 100%, 55%)`);
                gradient.addColorStop(1.0, `hsl(${hueOffset}, 100%, 55%)`);

                ctx.fillStyle = gradient;
                ctx.shadowColor = `hsl(${hueOffset}, 100%, 65%)`;
                ctx.shadowBlur = 20;
            } else if (spiralMode === 'blood') {
                // Render Blood Red spiral arm
                ctx.fillStyle = '#8b0000';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 15;
            } else if (spiralMode === 'toxic') {
                // Render Toxic Green spiral arm
                ctx.fillStyle = '#39ff14';
                ctx.shadowColor = '#00ff66';
                ctx.shadowBlur = 15;
            } else {
                // Render Black & White spiral arm
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 0;
            }

            // Draw arms independently to prevent diagonal polygon bridging
            for (let arm = 0; arm < numArms; arm++) {
                const armOffset = (arm * Math.PI);
                ctx.beginPath();
                ctx.moveTo(0, 0);

                // Forward trace
                for (let theta = 0; theta <= maxTheta; theta += step) {
                    const r = b * theta;
                    const angle = theta + armOffset;
                    ctx.lineTo(r * Math.cos(angle), r * Math.sin(angle));
                }

                // Inner trace back with armWidth offset
                for (let theta = maxTheta; theta >= 0; theta -= step) {
                    const r = b * theta;
                    const angle = theta + armOffset + armWidth;
                    ctx.lineTo(r * Math.cos(angle), r * Math.sin(angle));
                }

                ctx.lineTo(0, 0);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();

            if (spiralActive || speedTransitionStart !== null) {
                requestAnimationFrame(drawSpiral);
            }
        }

        function toggleSpiral(mode) {
            const now = performance.now();

            if (!spiralActive) {
                spiralMode = mode;
                spiralActive = true;
                spiralCanvas.classList.add('visible');
                targetSpeed = baseSpeed;
                startSpeed = 0;
                endSpeed = targetSpeed;
                speedTransitionStart = now;
                lastFrameTime = now;
                requestAnimationFrame(drawSpiral);
            } else if (spiralActive && spiralMode !== mode) {
                // Switch mode directly if changing between spiral modes
                spiralMode = mode;
            } else {
                // Reverse direction smooth 3-second transition
                targetSpeed = -targetSpeed;
                startSpeed = currentSpeed;
                endSpeed = targetSpeed;
                speedTransitionStart = now;
            }
        }

        function hideSpiral() {
            spiralActive = false;
            spiralCanvas.classList.remove('visible');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Keyboard Event Handlers
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            // Toggle full screen only when Ctrl + Space is pressed
            if (e.ctrlKey && (e.code === 'Space' || e.key === ' ')) {
                e.preventDefault();
                toggleFullscreen();
                return;
            }

            // Spiral arm sizing controls (+ / = to grow, - to shrink)
            if (e.key === '+' || e.key === '=') {
                armWidth = Math.min(MAX_ARM_WIDTH, armWidth + ARM_WIDTH_STEP);
                return;
            }

            if (e.key === '-' || e.key === '_') {
                armWidth = Math.max(MIN_ARM_WIDTH, armWidth - ARM_WIDTH_STEP);
                return;
            }

            // Loop distance controls (] to expand loop spacing, [ to contract)
            if (e.key === ']') {
                loopDistance = Math.min(MAX_LOOP_DIST, loopDistance + LOOP_DIST_STEP);
                return;
            }

            if (e.key === '[') {
                loopDistance = Math.max(MIN_LOOP_DIST, loopDistance - LOOP_DIST_STEP);
                return;
            }

            if (key === '9') {
                toggleSpiral('bw');
                return;
            }

            if (key === '0') {
                toggleSpiral('rainbow');
                return;
            }

            if (key === 'p') {
                toggleSpiral('blood');
                return;
            }

            if (key === ';') {
                toggleSpiral('toxic');
                return;
            }

            // Check if key is a standard color number or defined special action key
            if ((colorMap[key] || specialTransitions[key]) && activeKey !== key) {
                // Hide spiral overlay if switching to color modes
                hideSpiral();

                // Clear any existing timer loops
                clearTimeout(keyPressTimer);
                clearInterval(keyPressTimer);
                
                activeKey = key;
                isTransitioning = true;
                
                if (specialTransitions[key]) {
                    // Calculate duration: 10x multiplier if Shift key is held
                    const config = specialTransitions[key];
                    const durationSec = e.shiftKey ? config.baseDuration * 10 : config.baseDuration;
                    body.style.transition = `background-color ${durationSec.toFixed(1)}s linear`;
                    body.style.backgroundColor = config.color;
                } else {
                    // Regular dynamic timing transition setup for standard number keys
                    body.style.transition = 'background-color 0.1s ease';
                    body.style.backgroundColor = colorMap[key];

                    const startTime = Date.now();

                    keyPressTimer = setInterval(() => {
                        const elapsed = (Date.now() - startTime) / 1000;

                        if (elapsed >= 3.0) {
                            body.style.transition = 'background-color 6.0s linear';
                            clearInterval(keyPressTimer);
                        } else if (elapsed >= 1.0) {
                            body.style.transition = 'background-color 3.0s linear';
                        }
                    }, 100);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (activeKey === key) {
                activeKey = null;
                clearInterval(keyPressTimer);
                isTransitioning = false;
            }
        });
    </script>
</body>
</html>
