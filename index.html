<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Dairy Creamer</title>
    <style>
        /* Center the container and set background color */
        body {
            background-color: #000000;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertical centering */
            align-items: center;     /* Horizontal centering */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        p {
            margin: 12px 0;
            text-align: center;
        }

        /* Vibrant but darker green links */
        a {
            color: #00a854; /* Vibrant dark green */
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 600;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        /* Hover and focus state for better interactivity */
        a:hover, a:focus {
            color: #00e676; /* Brighter green on hover */
            text-decoration: underline;
        }

        a:visited {
            color: #008f45; /* Slightly darker shade for visited links */
        }
    </style>
</head>
<body>
    <p><a href="https://liamnagy.github.io/Non-Dairy-Creamer/Color-Picker-and-Spiral">Color Picker and Spiral</a></p>
    <p><a href="https://liamnagy.github.io/Non-Dairy-Creamer/Color-Tripper-and-Spiral">Color Tripper and Spiral</a></p>
    <p><a href="https://liamnagy.github.io/Non-Dairy-Creamer/Color-Tripper-and-Spiral-Control">Color Tripper and Spiral Control</a></p>
</body>
</html>
