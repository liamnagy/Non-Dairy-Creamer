<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Circle Animation & Cast</title>
    <!-- Load the official Google Cast Sender SDK framework -->
    <script src="https://gstatic.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Container forcing the circle to expand perfectly from the viewport center */
        .animation-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* The animated circle element */
        .circle {
            width: 6px;
            height: 6px;
            background-color: #ff0000;
            border-radius: 50%;
            border: 0px solid #ff0000;
            /* Cubic-bezier curve handles the punchy start and smooth expansion */
            animation: expandCircle 4s infinite cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes expandCircle {
            0% {
                width: 6px;
                height: 6px;
                background-color: #ff0000;
                border-width: 0px;
                transform: scale(1);
                opacity: 1;
            }
            3% {
                /* Quickly morphs from a solid dot to a thin outline */
                background-color: transparent;
                border-width: 2px;
            }
            85% {
                opacity: 1;
            }
            100% {
                /* 150vmax ensures it expands safely past the largest screen corners */
                width: 150vmax;
                height: 150vmax;
                background-color: transparent;
                border-width: 2px;
                opacity: 0;
            }
        }

        /* Cast Button Floating Container */
        .controls {
            position: absolute;
            bottom: 30px;
            z-index: 10;
        }

        /* Styling the standard web component launcher */
        google-cast-launcher {
            --connected-color: #ff0000;
            --disconnected-color: #ffffff;
            width: 44px;
            height: 44px;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 10px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        google-cast-launcher:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="animation-container">
        <div class="circle"></div>
    </div>

    <div class="controls">
        <!-- Official Cast Button Element provided by the SDK framework -->
        <google-cast-launcher id="cast-button"></google-cast-launcher>
    </div>

    <script>
        // Hook into the window global callback when the Cast API is available
        window.__onGCastApiAvailable = function(isAvailable) {
            if (isAvailable) {
                initializeCastApi();
            }
        };

        function initializeCastApi() {
            // Context settings using default media receiver parameters 
            cast.framework.CastContext.getInstance().setOptions({
                receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
        }
    </script>
</body>
</html>
