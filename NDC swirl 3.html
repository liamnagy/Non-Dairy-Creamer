<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Center Full Screen Neon Pulse Animation</title>
    <style>
        /* Force strict full screen viewport and strip scrollbars */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Solid black backdrop */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="neonCanvas"></canvas>

    <script>
        const canvas = document.getElementById('neonCanvas');
        const ctx = canvas.getContext('2d');

        // Dynamically compute screen dimensions and determine the true center point
        let centerX = 0;
        let centerY = 0;
        let maxDiagonal = 0;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Single, centralized hub
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
            
            // Calculate screen hypotenuse to guarantee particles push completely off-viewport
            maxDiagonal = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);

        // Core saturated neon palette matrix
        const neonColors = [
            '#00ffff', // Electric Cyan
            '#ff00ff', // Hot Magenta
            '#00ff00', // Acid Green
            '#ff3300', // Radioactive Orange
            '#ffff00', // Neon Yellow
            '#9d00ff'  // Quantum Purple
        ];

        const totalParticles = 1000;
        const particles = [];

        class Particle {
            constructor() {
                this.color = neonColors[Math.floor(Math.random() * neonColors.length)];
                
                // Directional vector metrics extending out from the single center
                this.angle = Math.random() * Math.PI * 2;
                
                // Variable base offsets so particles spread out evenly along the vector trajectory
                this.spreadVariation = Math.random() * 0.4 + 0.6; 
                
                // Sync pulse speeds so they compress and launch in unified waves
                this.pulseSpeed = 0.008 + Math.random() * 0.006;
                this.timeOffset = Math.random() * Math.PI * 0.15; // Minor phase variance for fluid texture
                this.size = Math.random() * 2 + 1.5;
            }

            update(time) {
                // Wave modifier scales up past 1.0 to guarantee pushing past screen borders
                const wave = Math.sin(time * this.pulseSpeed + this.timeOffset);
                
                // Transform native sine scale [-1, 1] into an extreme expansion multiplier
                const pulseFactor = (wave + 1) * 0.5;
                
                // Compute current position extending from single origin out past max canvas boundary limits
                const dynamicRadius = maxDiagonal * 0.85 * pulseFactor * this.spreadVariation;
                
                this.x = centerX + Math.cos(this.angle) * dynamicRadius;
                this.y = centerY + Math.sin(this.angle) * dynamicRadius;
            }

            draw() {
                // Optimization: Don't render geometry elements currently completely off screen space
                if (this.x < -10 || this.x > canvas.width + 10 || this.y < -10 || this.y > canvas.height + 10) {
                    return;
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // Neon glow engine layer configuration
                ctx.shadowBlur = this.size * 4;
                ctx.shadowColor = this.color;
                
                ctx.fill();
            }
        }

        // Initialize state arrays
        function init() {
            resizeCanvas();
            for (let i = 0; i < totalParticles; i++) {
                particles.push(new Particle());
            }
        }

        let runTime = 0;
        function animate() {
            // High contrast overlay clearing loop with deep fade motion trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            runTime += 1;
            
            // Loop calculations over the 1,000 array instances
            particles.forEach(particle => {
                particle.update(runTime);
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        // Fire initialization sequence and main clock engine
        init();
        animate();
    </script>
</body>
</html>
